name: scarborough_tortoise_watch
description: A privacy-conscious community tortoise sighting reporter for Scarborough.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.3.4
  firebase_app_check: ^0.3.2+4
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.4
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.3
  go_router: ^14.8.1
  geolocator: ^13.0.2
  image: ^4.5.4
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JournalSerif
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
  assets:
    - assets/config/
    - assets/sample/
    - assets/SVG/Tortoise.svg
    - assets/SVG/good-spotting-logo.svg
    - assets/images/tortoise-real.jpeg
